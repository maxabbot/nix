name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Cancel in-progress runs for the same branch/PR on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  nix-flake-check:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the change detection below can diff against the
          # push's previous head or the PR's base.
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Pre-fetch all flake inputs
        run: nix flake archive --json > /dev/null

      # The `checks` output (the DMS shell, greeter and plugins, whose
      # --replace-fail patches only fail at build time; see flake.nix) takes
      # ~8 minutes to build, so only build it when something it's built from
      # changed. With no usable base (a new branch, a force-push) build anyway.
      - name: Did the checks' inputs change?
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          build=true
          if git cat-file -e "$BASE^{commit}" 2>/dev/null \
            && git diff --quiet "$BASE" HEAD -- \
              flake.nix flake.lock overlays/ \
              modules/home/wm/dms.nix modules/home/wm/dms-plugins.nix config/dms/ \
              hosts/common/optional/productivity.nix .github/workflows/ci.yml; then
            build=false
          fi
          echo "build=$build" >>"$GITHUB_OUTPUT"
          echo "build the checks: $build"

      # Both steps evaluate both hosts; neither builds the hosts themselves.
      - name: Run flake checks (evaluate only)
        if: steps.changed.outputs.build != 'true'
        run: nix flake check --no-build

      - name: Run flake checks (and build the DMS derivations)
        if: steps.changed.outputs.build == 'true'
        run: nix flake check

  nixfmt:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Check Nix formatting (nixfmt-tree)
        run: |
          nix fmt
          git diff --exit-code

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Shellcheck scripts
        # config/scripts/ holds bash scripts without the .sh extension
        run: git ls-files '*.sh' 'config/scripts/*' | xargs -r shellcheck

  lint:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@v3

      - name: statix
        run: nix develop --command statix check .

      - name: deadnix
        run: nix develop --command deadnix --fail .
