# ============================================================================
# Hyprlock fingerprint unlock — appended to hyprlock.conf on hosts that run
# fprintd (modules/home/apps.nix). hyprlock asks fprintd over D-Bus, alongside
# the password field; the host turns off PAM's own fprint step for hyprlock.
# ============================================================================

auth {
    fingerprint {
        enabled = true
    }
}

# Fingerprint status, under the input field
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(@grayBright-rgb@, 1.0)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -175
    halign = center
    valign = center
}
